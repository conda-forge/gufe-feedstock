schema_version: 1

context:
  python_min: "3.12"
  name: gufe
  version: 1.13.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/OpenFreeEnergy/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ee5cf9c2da4af34b023c76897c30e27165223ea54a00ca5615734e3e9384140f

build:
  number: 0
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }} ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=78.1.1  # security-related bugfix https://setuptools.pypa.io/en/stable/history.html#v78-1-1
    - setuptools_scm
  run:
    - msgpack-python
    - networkx
    - numpy
    - openff-toolkit-base >=0.15.1
    - openff-interchange >=0.5.4
    - openff-units >=0.4.0
    - openmm
    - pint
    - pip
    - pooch >=1.9.0  # min needed for https://github.com/fatiando/pooch/issues/502
    - pydantic >=2.13
    - python >=${{ python_min }}
    - rdkit >=2024.09.1  # github.com/OpenFreeEnergy/gufe/issues/664
    - typing-extensions
    - zstandard

tests:
  - python:
      imports:
        - gufe
      pip_check: false
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - pooch
        - pytest
        - python ${{ python_min }}.*
    script:
      - python -c "import ${{ name }}; print(${{ name }}.__version__)"
      - python -c "import ${{ name }}; assert(${{ name }}.__version__ == '${{ version }}')"
      - pytest -v --pyargs gufe

about:
  summary: gufe
  description: |
    Abstract base classes for free energy calculations by Open Free Energy
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/OpenFreeEnergy/gufe
  repository: https://github.com/OpenFreeEnergy/gufe
  documentation: https://gufe.openfree.energy

extra:
  recipe-maintainers:
    - IAlibay
    - dotsdl
    - dwhswenson
    - mikemhenry
    - atravitz
